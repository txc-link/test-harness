#:schema https://developers.openai.com/codex/config-schema.json

# Everything Claude Code（ECC）的项目本地 Codex 参考配置。
# 全局默认值请放在 ~/.codex/config.toml；本文件只描述本仓库期望。

# 模型选择保持为空，让 Codex CLI 使用当前内置默认值。
# 只有在明确需要固定模型时，才在本文件或全局配置中设置 model。

# 顶层运行时设置。
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# 外部通知会从 stdin 接收 JSON payload。
notify = [
  "terminal-notifier",
  "-title", "Codex ECC",
  "-message", "任务已完成",
  "-sound", "default",
]

# 追加到每次提示的持久说明。
persistent_instructions = "遵循项目 AGENTS.md。可用 MCP server 能帮助任务时优先使用。"

# MCP servers。
# API 凭据应来自启动环境或用户级 ~/.codex/config.toml，不要写入本仓库。
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
startup_timeout_sec = 30

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 30

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]
startup_timeout_sec = 30

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--extension"]
startup_timeout_sec = 30

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
startup_timeout_sec = 30

[features]
# 明确记录本仓库期望支持多 Agent 协作。
multi_agent = true

# profile 可通过 codex -p <name> 切换。
[profiles.strict]
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "cached"

[profiles.yolo]
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
# 多 Agent 角色限制和项目本地角色定义。
max_threads = 6
max_depth = 1

[agents.explorer]
description = "只读代码库探索者，用于在变更前收集证据。"
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR 评审者，关注正确性、安全性和缺失测试。"
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "文档研究者，用于验证 API、框架行为和发布说明。"
config_file = "agents/docs-researcher.toml"

id: REQ-0002
title: Self-Evolving Investment Agent
created_at: '2026-05-16T13:04:40.021133Z'
problem: 验证一键流程：从需求生成、拆解、排期、评估门禁到代码测试全流程跑通。
target_users:
- 个人投资者
- 小型投研团队
- 量化策略研究者
outcomes:
- 从需求到开发任务的工程流程可追踪
- 投资假设、交易计划、账户表现和复盘结果可结构化记录
- Agent 与 Skill 的改进必须通过评估门禁
scope:
- 需求结构化
- 任务拆解和排期
- 盈利评估体系
- 自我进化评估体系
- 测试和 CI 基线
non_goals:
- 第一阶段不做默认实盘自动交易
- 第一阶段不做模型权重在线自训练
risks:
- 免费数据源稳定性不足
- AI 判断不可解释或不可复盘
- 策略过拟合历史行情
- 自动进化误改高风险交易逻辑
acceptance_criteria:
- 可以从一条需求生成结构化需求文档
- 可以生成包含评估门禁的开发任务
- 可以验证核心文档和评估规格存在
- 测试命令可以在本地通过

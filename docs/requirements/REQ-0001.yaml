id: REQ-0001
title: 可复盘自我进化投资 Agent
created_at: '2026-05-16T13:03:45.657545Z'
problem: 建立可复盘、可自我进化的最强投资 Agent。系统需要覆盖 Agent 与账户盈利评估体系、自我进化体系、投资假设账本、交易计划账本、盯盘告警、复盘归因、Skill 版本化晋升门禁，并能从需求生成、拆解、排期开发、代码测试全流程跑通。
target_users:
- 个人投资者
- 小型投研团队
- 量化策略研究者
outcomes:
- 从需求到开发任务的工程流程可追踪。
- 投资假设、交易计划、账户表现和复盘结果可结构化记录。
- Agent 和 Skill 的改进必须通过评估门禁。
scope:
- 需求结构化。
- 任务拆解和排期。
- 盈利评估体系。
- 自我进化评估体系。
- 测试和 CI 基线。
non_goals:
- 第一阶段不做默认实盘自动交易。
- 第一阶段不做模型权重在线自训练。
risks:
- 免费数据源稳定性不足。
- AI 判断可能不可解释或不可复盘。
- 策略可能过拟合历史行情。
- 自动进化可能误改高风险交易逻辑。
acceptance_criteria:
- 可以从一条需求生成结构化需求文档。
- 可以生成包含评估门禁的开发任务。
- 可以验证核心文档和评估规格存在。
- 测试命令可以在本地通过。

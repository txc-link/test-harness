id: REQ-0004
title: UTF-8 需求文档 Smoke Test
created_at: '2026-05-16T14:15:39.731745Z'
problem: |
  # Harness Flow UTF-8 Smoke Requirement

  从需求文档生成结构化需求、roadmap、sprint、开发交付物和测试证据，验证中文需求文档可以稳定进入 Harness 工作流。
target_users:
- 个人投资者
- 小型投研团队
- 量化策略研究者
outcomes:
- 从需求到任务再到验证的工程流程可追踪。
- 投资假设、交易计划、账户表现和复盘结果可以结构化记录。
- Agent 和 skill 改进必须通过评估门禁后才能晋升。
scope:
- 结构化需求摄入。
- roadmap 拆解和 sprint 计划。
- 账户盈利评估。
- 受控自我进化评估。
- 本地测试和 CI 基线。
non_goals:
- 第一阶段不默认启用实盘自动交易。
- 第一阶段不做模型权重在线自训练。
risks:
- 免费市场数据源可能不稳定。
- AI 投资判断可能难以解释或复盘。
- 策略可能过拟合历史市场环境。
- 自动进化可能削弱高风险交易逻辑。
acceptance_criteria:
- 原始需求可以生成结构化需求产物。
- Harness 可以生成带门禁的工程任务。
- 核心工作流文档和评估规格可以被验证。
- 本地检查稳定通过。

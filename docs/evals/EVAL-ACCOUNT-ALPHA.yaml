id: EVAL-ACCOUNT-ALPHA
name: 账户盈利归因评估
objective: 在剥离市场波动和用户执行影响后，衡量 Agent 是否真实改善账户结果。
metrics:
- total_return
- benchmark_excess_return
- max_drawdown
- sharpe_ratio
- calmar_ratio
- win_rate
- profit_factor
- agent_contribution
- user_execution_drag
data_sources:
- positions
- orders
- benchmarks
- agent_recommendations
- market_bars
cadence: daily_close_and_weekly_review
promotion_rules:
- Agent 建议的 shadow portfolio 在评估窗口内跑赢基准。
- 回撤不超过已批准的风险预算。
- 置信度校准误差改善或保持稳定。
rollback_rules:
- 超额回撤突破限制。
- 信号误报率超过阈值。
- 用户覆盖 Agent 建议后的成功率显著高于采纳 Agent 建议的成功率。

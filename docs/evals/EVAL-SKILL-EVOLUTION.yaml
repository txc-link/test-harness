id: EVAL-SKILL-EVOLUTION
name: Skill 进化门禁
objective: 只晋升通过回测和 shadow live 证明更优的 skill 版本。
metrics:
- hit_rate_by_horizon
- excess_return_by_horizon
- max_adverse_excursion
- false_positive_rate
- signal_frequency
- market_regime_coverage
- rollback_rate
data_sources:
- hypothesis_ledger
- review_ledger
- skill_versions
- backtest_results
cadence: weekly_or_after_30_new_signals
promotion_rules:
- 候选 skill 在主指标上优于当前 active 版本。
- 候选 skill 不恶化最大回撤。
- 候选 skill 至少通过一个样本外市场 regime。
- 高风险变更必须人工审批。
rollback_rules:
- shadow live 表现低于当前 active skill。
- 市场 regime 检测器判定该 skill 不适用。
- 风险 Agent 标记重复失败模式。
